name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/set-version.mjs --check
      - run: npm run build
      - run: npm run typecheck
      - run: npx -y web-ext@8 lint -s extension
      - run: node test/e2e.mjs
      - run: MISSING=1 node test/e2e.mjs
      - run: node test/host.mjs
      - run: npx playwright install --with-deps firefox
      - run: node test/content.mjs
