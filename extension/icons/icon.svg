<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">WebMCP Controller</title>
  <desc id="desc">A three-node MCP graph flows into a browser window and becomes a mouse cursor.</desc>

  <defs>
    <linearGradient id="accent" x1="56" y1="38" x2="205" y2="214" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFB02E"/>
      <stop offset="0.36" stop-color="#FF6A3D"/>
      <stop offset="0.68" stop-color="#F22986"/>
      <stop offset="1" stop-color="#8B3DFF"/>
    </linearGradient>
  </defs>

  <!-- App tile -->
  <rect x="8" y="8" width="240" height="240" rx="52" fill="#0B1020"/>

  <!-- Browser window fill -->
  <rect x="34" y="94" width="188" height="128" rx="28" fill="#101729"/>

  <!-- Browser border: split top to create a clean center join for the stem -->
  <g fill="none" stroke="url(#accent)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M62 94H111"/>
    <path d="M145 94H194"/>
    <path d="M194 94A28 28 0 0 1 222 122V194A28 28 0 0 1 194 222H62A28 28 0 0 1 34 194V122A28 28 0 0 1 62 94"/>
  </g>

  <!-- Browser chrome -->
  <path d="M42 122H118" stroke="#2A344D" stroke-width="5" stroke-linecap="round"/>
  <path d="M138 122H214" stroke="#2A344D" stroke-width="5" stroke-linecap="round"/>
  <circle cx="56" cy="108" r="4" fill="#7E8AA4"/>
  <circle cx="70" cy="108" r="4" fill="#7E8AA4"/>
  <circle cx="84" cy="108" r="4" fill="#7E8AA4"/>

  <!-- MCP graph -->
  <g fill="none" stroke="url(#accent)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M128 41V84"/>
    <path d="M90 65L128 84L166 65"/>
    <path d="M128 84V142"/>
  </g>
  <circle cx="128" cy="41" r="10" fill="url(#accent)"/>
  <circle cx="90" cy="65" r="9" fill="url(#accent)"/>
  <circle cx="166" cy="65" r="9" fill="url(#accent)"/>

  <!-- Cursor -->
  <path d="M128 142L157 190L166 172L185 190L197 178L178 160L198 151Z"
        fill="url(#accent)" stroke="#0B1020" stroke-width="5" stroke-linejoin="round"/>
</svg>
