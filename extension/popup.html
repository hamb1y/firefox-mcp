<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Firefox MCP Bridge</title>
<link rel="stylesheet" href="ui.css">
<style>
  body { width: 320px; padding: 14px; }
  h1 { font-size: 14px; margin: 0 0 8px; display: flex; align-items: center; gap: 8px; }
  #detail { font-size: 12px; color: var(--muted); margin: 0 0 10px; word-break: break-all; white-space: pre-line; }
  #err { font-size: 12px; color: var(--bad); margin: 0 0 10px; }
  #err:empty, [hidden] { display: none !important; }
  #setup { font-size: 12px; margin: 0 0 12px; }
  #setup .row { margin: 6px 0; }
  #copy { width: 100%; margin-bottom: 8px; }
  #cursorRow { font-weight: normal; margin: 0 0 10px; }
</style>
</head>
<body>
<h1><span id="dot" class="dot"></span><span id="state">Checking…</span></h1>
<div id="err"></div>
<div id="detail"></div>
<div id="setup" hidden></div>
<button id="copy" type="button" class="primary" hidden>Copy MCP config</button>
<label class="switch" id="cursorRow" title="Show where the AI is acting, and what it says it’s doing"><input type="checkbox" id="cursor"> Show AI cursor</label>
<div class="row">
  <button id="retry" type="button">Retry</button>
  <button id="open" type="button">Settings</button>
</div>
<script src="common.js"></script>
<script src="popup.js"></script>
</body>
</html>
